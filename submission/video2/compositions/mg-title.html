<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /></head>
<body>
<template id="mg-title-template">
<style>
@font-face { font-family: "Geist"; src: url("assets/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Geist Mono"; src: url("assets/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Noto Nastaliq Urdu"; src: url("assets/fonts/NotoNastaliqUrdu.ttf") format("truetype"); font-weight: 400 700; }
#mg-title { position:absolute; inset:0; width:100%; height:100%; overflow:hidden; font-family:"Geist", sans-serif; color:#F5F5F7; }
#mg-title .wrap { position:absolute; inset:0; background:#05060A; overflow:hidden; }
#mg-title .grid { position:absolute; inset:-200px;
  background-image: linear-gradient(rgba(110,130,255,.07) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(110,130,255,.07) 1.5px, transparent 1.5px);
  background-size: 120px 120px; -webkit-mask-image: radial-gradient(60% 60% at 50% 45%, #000 0%, transparent 100%); mask-image: radial-gradient(60% 60% at 50% 45%, #000 0%, transparent 100%); }
#mg-title .halo { position:absolute; left:960px; top:420px; width:1600px; height:1000px; margin:-500px 0 0 -800px; border-radius:50%;
  background: radial-gradient(closest-side, rgba(39,71,245,.42), rgba(39,71,245,.10) 55%, rgba(39,71,245,0)); opacity:0; }
#mg-title .slit { position:absolute; left:0; top:420px; width:100%; height:3px; margin-top:-1px; background:#fff; box-shadow:0 0 40px 10px rgba(124,143,255,.9); transform-origin:50% 50%; }
#mg-title .lock { position:absolute; left:0; right:0; top:300px; display:flex; align-items:center; justify-content:center; gap:46px; transform-origin:50% 50%; }
#mg-title .mark { width:220px; height:220px; flex:none; overflow:visible; }
#mg-title .mark .tile { transform-origin:32px 32px; }
#mg-title .mark .ln { fill:none; stroke:#FFFFFF; stroke-width:3.2; stroke-linecap:square; filter: drop-shadow(0 0 2px rgba(160,178,255,.9)); }
#mg-title .word { position:relative; display:flex; align-items:baseline; gap:32px; }
#mg-title .en { position:relative; font-size:210px; font-weight:640; letter-spacing:-0.055em; line-height:1; color:#FFFFFF; }
#mg-title .en .shine { position:absolute; inset:0; color:transparent; -webkit-background-clip:text; background-clip:text;
  background-image: linear-gradient(100deg, rgba(255,255,255,0) 35%, rgba(170,190,255,1) 50%, rgba(255,255,255,0) 65%); background-size:300% 100%; background-repeat:no-repeat; }
#mg-title .ur { font-family:"Noto Nastaliq Urdu", serif; font-size:112px; color:rgba(255,255,255,.62); line-height:1; }
#mg-title .tag { position:absolute; left:0; right:0; top:610px; text-align:center; font-size:58px; font-weight:480; letter-spacing:-0.02em; color:#B6BAC8; }
#mg-title .tag b { color:#fff; font-weight:640; }
/* the stack */
#mg-title .runs { position:absolute; left:0; right:0; top:500px; text-align:center; font-family:"Geist Mono", monospace; font-size:30px; letter-spacing:.2em; color:#8A90A2; text-transform:uppercase; opacity:0; }
#mg-title .row { position:absolute; left:0; right:0; top:570px; display:flex; justify-content:center; align-items:stretch; gap:0; }
#mg-title .card { position:relative; width:700px; height:340px; border-radius:30px; padding:38px 46px; background:linear-gradient(180deg, rgba(24,27,36,.96), rgba(14,16,22,.96)); opacity:0; }
#mg-title .card.nv, #mg-title .card.nb { box-shadow: 0 0 0 2px rgba(124,143,255,.50), 0 30px 120px -30px rgba(39,71,245,.60); }
#mg-title .card .top { display:flex; flex-direction:column; align-items:flex-start; gap:12px; }
#mg-title .card .brand { font-family:"Geist Mono", monospace; font-size:30px; letter-spacing:.22em; color:#9DA3B4; text-transform:uppercase; }
#mg-title .card .name { font-size:96px; font-weight:680; letter-spacing:-0.045em; line-height:1; color:#fff; white-space:nowrap; }
#mg-title .card .sub { margin-top:22px; display:flex; gap:14px; flex-wrap:nowrap; }
#mg-title .pill { height:62px; display:flex; align-items:center; padding:0 24px; border-radius:999px; font-size:32px; font-weight:560; white-space:nowrap; }
#mg-title .nv .pill, #mg-title .nb .pill { background:rgba(124,143,255,.12); color:#C8D0FF; box-shadow: inset 0 0 0 2px rgba(124,143,255,.42); }
#mg-title .card .sheen { position:absolute; inset:0; border-radius:30px; overflow:hidden; pointer-events:none; }
#mg-title .card .sheen i { position:absolute; top:0; left:-50%; width:40%; height:100%; background:linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,.14), rgba(255,255,255,0)); }
#mg-title .join { width:200px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; opacity:0; }
#mg-title .join span { font-family:"Geist Mono", monospace; font-size:28px; letter-spacing:.14em; color:#9DA3B4; text-transform:uppercase; white-space:nowrap; }
#mg-title .join svg { width:84px; height:30px; }
#mg-title .also { position:absolute; left:0; right:0; bottom:70px; display:flex; justify-content:center; align-items:center; gap:56px; opacity:0; }
#mg-title .also .it { display:flex; align-items:center; gap:16px; font-size:34px; font-weight:520; color:#C9CCD6; white-space:nowrap; }
#mg-title .also .k { font-family:"Geist Mono", monospace; font-size:28px; letter-spacing:.16em; color:#6E7488; text-transform:uppercase; }
#mg-title .grain { position:absolute; inset:-256px; background:url("assets/img/grain.png"); opacity:.06; mix-blend-mode:overlay; }
#mg-title .cover { position:absolute; inset:0; background:#2747F5; transform-origin:0 50%; transform:scaleX(0); }
</style>
<div id="mg-title" data-composition-id="mg-title" data-width="1920" data-height="1080" data-duration="9.083">
  <div class="wrap" id="mg-title-wrap">
    <div class="grid" id="mg-title-grid"></div>
    <div class="halo" id="mg-title-halo"></div>
    <div class="slit" id="mg-title-slit"></div>
    <div class="lock" id="mg-title-lock">
      <svg class="mark" id="mg-title-mark" viewBox="0 0 64 64">
        <rect class="tile" id="mg-title-tile" width="64" height="64" rx="16" fill="#1A1D27" stroke="rgba(160,178,255,.55)" stroke-width="1" />
        <rect class="ln" pathLength="1" x="16" y="14" width="32" height="36" />
        <path class="ln" pathLength="1" d="M16 31h13M29 31v-6" />
        <path class="ln" pathLength="1" d="M37 14v11M37 31h11" />
        <path class="ln" pathLength="1" d="M29 50V41" />
        <circle id="mg-title-dot" cx="45" cy="45" r="5" fill="#2747F5" />
      </svg>
      <div class="word" id="mg-title-word"><span class="en">Naqsha<span class="shine" id="mg-title-shine">Naqsha</span></span><span class="ur" lang="ur" dir="rtl">نقشہ</span></div>
    </div>
    <div class="tag" id="mg-title-tag"><b>Agentic</b> home design studio</div>

    <div class="runs" id="mg-title-runs">Every agent runs on</div>
    <div class="row">
      <div class="card nv" id="mg-title-nv">
        <div class="top"><div class="brand">NVIDIA</div><div class="name">Nemotron</div></div>
        <div class="sub"><div class="pill">3 Ultra</div><div class="pill">3 Super</div><div class="pill">3.5 Super VL</div></div>
        <div class="sheen"><i id="mg-title-sh1"></i></div>
      </div>
      <div class="join" id="mg-title-join"><span>served by</span><svg viewBox="0 0 84 30" fill="none" stroke="#9DA3B4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15h72M64 4l12 11-12 11"/></svg></div>
      <div class="card nb" id="mg-title-nb">
        <div class="top"><div class="brand">Nebius</div><div class="name" style="font-size:84px;line-height:1.14">Token Factory</div></div>
        <div class="sub"><div class="pill">every model, one API</div></div>
        <div class="sheen"><i id="mg-title-sh2"></i></div>
      </div>
    </div>
    <div class="also" id="mg-title-also">
      <span class="k">With</span>
      <div class="it">Tavily for city rules</div>
      <div class="it">Gemini for photos</div>
    </div>
    <div class="grain" id="mg-title-grain"></div>
  </div>
  <div class="cover" id="mg-title-cover"></div>
</div>
<script>
(function(){
const C = {"tag": 0.89, "every": 3.45, "nvidia": 4.85, "nemotron": 5.45, "served": 6.0, "nebius": 6.505, "factory": 7.05};
const D = 9.083;
const tl = gsap.timeline({ paused: true });
const $ = (id) => document.getElementById("mg-title-" + id);
tl.fromTo($("grain"), { x: 0, y: 0 }, { x: 256, y: 192, duration: D, ease: "steps(" + Math.round(D * 12) + ")" }, 0);
tl.fromTo($("grid"), { y: 0 }, { y: -60, duration: D, ease: "none" }, 0);
// impact: a slit of light opens into the mark and the word
tl.fromTo($("slit"), { scaleX: 0, opacity: 1 }, { scaleX: 1, duration: 0.3, ease: "expo.out" }, 0.0);
tl.to($("slit"), { scaleY: 40, opacity: 0, duration: 0.45, ease: "power2.out" }, 0.28);
tl.fromTo($("halo"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.9, ease: "power2.out" }, 0.25);
tl.fromTo($("tile"), { scale: 0.2, rotation: -30, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.6, ease: "back.out(1.6)" }, 0.3);
document.querySelectorAll("#mg-title .ln").forEach((p, i) => {
  tl.fromTo(p, { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" }, 0.48 + i * 0.08);
});
tl.fromTo($("dot"), { scale: 0, transformOrigin: "45px 45px" }, { scale: 1, duration: 0.4, ease: "back.out(3)" }, 0.9);
tl.fromTo($("word"), { opacity: 0, x: -50, filter: "blur(14px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, 0.38);
tl.fromTo($("shine"), { backgroundPosition: "150% 0" }, { backgroundPosition: "-50% 0", duration: 1.1, ease: "power2.inOut" }, 0.75);
tl.fromTo($("lock"), { scale: 1.0 }, { scale: 1.035, duration: C.every, ease: "none" }, 0);
// "an agentic home design studio"
tl.fromTo($("tag"), { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, C.tag);
// "every agent in it runs on …": the lockup rises, the stack arrives
tl.to($("tag"), { opacity: 0, y: -20, duration: 0.3, ease: "power2.in" }, C.every - 0.15);
tl.to($("lock"), { y: -170, scale: 0.62, duration: 0.6, ease: "expo.inOut" }, C.every - 0.1);
tl.to($("halo"), { y: -170, scale: 0.8, opacity: 0.7, duration: 0.6, ease: "expo.inOut" }, C.every - 0.1);
tl.fromTo($("runs"), { opacity: 0, y: 14, scaleX: 1.25 }, { opacity: 1, y: 0, scaleX: 1, duration: 0.6, ease: "expo.out" }, C.every + 0.25);
tl.fromTo($("nv"), { opacity: 0, y: 60, rotationX: 30, transformPerspective: 1400 }, { opacity: 1, y: 0, rotationX: 0, duration: 0.6, ease: "expo.out" }, C.nvidia);
tl.fromTo($("sh1"), { x: 0 }, { x: 1600, duration: 0.9, ease: "power2.inOut" }, C.nvidia + 0.25);
document.querySelectorAll("#mg-title-nv .pill").forEach((p, i) => tl.fromTo(p, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(2)" }, C.nemotron + 0.1 + i * 0.08));
tl.fromTo($("join"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, C.served);
tl.fromTo($("nb"), { opacity: 0, y: 60, rotationX: 30, transformPerspective: 1400 }, { opacity: 1, y: 0, rotationX: 0, duration: 0.6, ease: "expo.out" }, C.nebius);
tl.fromTo($("sh2"), { x: 0 }, { x: 1600, duration: 0.9, ease: "power2.inOut" }, C.nebius + 0.25);
tl.fromTo("#mg-title-nb .pill", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(2)" }, C.factory + 0.1);
tl.fromTo($("also"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, C.factory + 0.45);
// hand-off to the product: a cobalt sweep, then the light studio underneath
tl.to($("cover"), { scaleX: 1, duration: 0.36, ease: "power3.in" }, D - 0.6);
tl.set($("wrap"), { opacity: 0 }, D - 0.24);
tl.to($("cover"), { transformOrigin: "100% 50%", scaleX: 0, duration: 0.24, ease: "power3.out" }, D - 0.24);
window.__timelines["mg-title"] = tl;
})();
</script>
</template>
</body></html>
