<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /></head>
<body>
<template id="mg-hook-template">
<style>
@font-face { font-family: "Geist"; src: url("assets/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Geist Mono"; src: url("assets/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; }
#mg-hook { position:absolute; inset:0; width:100%; height:100%; overflow:hidden; background:#05060A; font-family:"Geist", sans-serif; color:#F5F5F7; }
#mg-hook .grid { position:absolute; inset:-200px;
  background-image: linear-gradient(rgba(110,130,255,.09) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(110,130,255,.09) 1.5px, transparent 1.5px),
    linear-gradient(rgba(110,130,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(110,130,255,.045) 1px, transparent 1px);
  background-size: 240px 240px, 240px 240px, 48px 48px, 48px 48px; }
#mg-hook .glow { position:absolute; inset:0; background: radial-gradient(900px 640px at 50% 46%, rgba(39,71,245,.20), rgba(39,71,245,0) 70%); }
#mg-hook .vign { position:absolute; inset:0; background: radial-gradient(130% 110% at 50% 50%, rgba(0,0,0,0) 45%, rgba(0,0,0,.8) 100%); }
#mg-hook .kicker { position:absolute; left:120px; top:96px; font-family:"Geist Mono", monospace; font-size:30px; letter-spacing:.16em; color:#8A90A2; text-transform:uppercase; white-space:nowrap; }
#mg-hook .kicker i { display:inline-block; width:12px; height:12px; border-radius:50%; background:#FF453A; margin-right:16px; vertical-align:2px; box-shadow:0 0 0 6px rgba(255,69,58,.2); }
/* beat 1: the big line */
#mg-hook .big { position:absolute; left:0; right:0; top:330px; text-align:center; }
#mg-hook .big .a { font-size:96px; font-weight:600; letter-spacing:-0.04em; line-height:1.0; color:#E9EAF0; }
#mg-hook .big .b { font-size:232px; font-weight:720; letter-spacing:-0.06em; line-height:1.0; margin-top:10px; color:#fff; }
#mg-hook .big .b .w { background: linear-gradient(180deg, #FFFFFF 10%, #AEBBFF 100%); -webkit-background-clip:text; background-clip:text; color:transparent; padding-bottom:0.06em; }
#mg-hook .mask { display:inline-block; overflow:hidden; vertical-align:bottom; padding:0 0.04em 0.08em; }
#mg-hook .w { display:inline-block; }
/* beat 2-3: the drafts */
#mg-hook .lines { position:absolute; left:120px; top:250px; width:820px; }
#mg-hook .line { font-size:72px; font-weight:640; letter-spacing:-0.035em; line-height:1.06; margin-bottom:36px; opacity:0; }
#mg-hook .line.red { color:#FF6B61; }
#mg-hook .stage { position:absolute; left:1010px; top:130px; width:820px; height:820px; perspective:1800px; }
#mg-hook .sheet { position:absolute; left:110px; top:60px; width:600px; height:720px; border-radius:14px; background:linear-gradient(180deg,#12172A,#0C1020);
  box-shadow:0 0 0 2px rgba(150,170,255,.22), 0 50px 120px -40px rgba(0,0,0,.9); opacity:0; }
#mg-hook .sheet svg { position:absolute; left:50px; top:50px; width:500px; height:560px; }
#mg-hook .sheet .p { fill:none; stroke:rgba(214,222,255,.9); stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
#mg-hook .sheet .pd { fill:none; stroke:rgba(214,222,255,.45); stroke-width:3; stroke-dasharray:10 10; }
#mg-hook .sheet .tag { position:absolute; left:50px; bottom:34px; font-family:"Geist Mono", monospace; font-size:28px; color:#8A90A2; letter-spacing:.06em; }
#mg-hook .sheet .redl { fill:none; stroke:#FF453A; stroke-width:6; stroke-linecap:round; }
#mg-hook .sheet .redc { fill:none; stroke:#FF453A; stroke-width:5; }
#mg-hook .weeks { position:absolute; left:120px; bottom:100px; font-family:"Geist Mono", monospace; opacity:0; white-space:nowrap; }
#mg-hook .weeks .l { font-size:28px; letter-spacing:.16em; color:#8A90A2; text-transform:uppercase; }
#mg-hook .weeks .n { font-size:120px; font-weight:600; line-height:1; color:#fff; font-variant-numeric:tabular-nums; letter-spacing:-0.02em; }
#mg-hook .stamp { position:absolute; left:120px; top:280px; padding:18px 40px; border:12px solid #FF453A; border-radius:18px; color:#FF453A;
  font-size:112px; font-weight:820; letter-spacing:.05em; background:rgba(40,6,6,.55); opacity:0; transform-origin:50% 50%; box-shadow:0 0 80px -10px rgba(255,69,58,.6); }
#mg-hook .reason { position:absolute; left:70px; top:560px; width:700px; padding:20px 26px 22px; border-radius:16px; background:rgba(60,10,10,.85); box-shadow:0 0 0 2px rgba(255,69,58,.55); opacity:0; }
#mg-hook .reason .who { font-size:30px; font-weight:600; color:#FFB4AE; margin-bottom:6px; }
#mg-hook .reason .why { font-family:"Geist Mono", monospace; font-size:28px; white-space:nowrap; color:#FFD9D6; }
#mg-hook .redwash { position:absolute; inset:0; background: radial-gradient(120% 100% at 50% 50%, rgba(255,40,30,0) 40%, rgba(255,40,30,.45) 100%); opacity:0; }
/* beat 4: the room nobody can walk through */
#mg-hook .room { position:absolute; inset:0; opacity:0; }
#mg-hook .room svg { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:960px 560px; }
#mg-hook .room .rl { fill:none; stroke:rgba(170,182,220,.55); stroke-width:2.4; }
#mg-hook .room .rd { fill:none; stroke:rgba(170,182,220,.28); stroke-width:2; stroke-dasharray:12 12; }
#mg-hook .room .door { fill:rgba(39,71,245,.10); stroke:#5D78FF; stroke-width:3; }
#mg-hook .close { position:absolute; left:0; right:0; top:800px; text-align:center; text-shadow:0 4px 30px #000, 0 0 12px #000; font-size:76px; font-weight:640; letter-spacing:-0.035em; line-height:1.06; opacity:0; }
#mg-hook .close span { color:#7C8FFF; }
#mg-hook .grain { position:absolute; inset:-256px; background:url("assets/img/grain.png"); opacity:.07; mix-blend-mode:overlay; }
#mg-hook .black { position:absolute; inset:0; background:#000; opacity:0; }
</style>
<div id="mg-hook" data-composition-id="mg-hook" data-width="1920" data-height="1080" data-duration="12.836">
  <div class="grid" id="mg-hook-grid"></div>
  <div class="glow" id="mg-hook-glow"></div>
  <div class="kicker" id="mg-hook-kicker"><i></i>Pakistan · building a home today</div>

  <div class="big" id="mg-hook-big">
    <div class="a"><span class="mask"><span class="w">Most</span></span> <span class="mask"><span class="w">families</span></span> <span class="mask"><span class="w">build</span></span> <span class="mask"><span class="w">a</span></span> <span class="mask"><span class="w">home</span></span></div>
    <div class="b"><span class="mask"><span class="w" id="mg-hook-once">only once.</span></span></div>
  </div>

  <div class="lines" id="mg-hook-lines">
    <div class="line" id="mg-hook-l2">The plan goes back and forth for weeks.</div>
    <div class="line red" id="mg-hook-l4">One setback mistake, and the authority sends it back.</div>
  </div>
  <div class="stage" id="mg-hook-stage">
    <div class="sheet" id="mg-hook-s1"><svg viewBox="0 0 500 560">
      <rect class="p" x="20" y="20" width="460" height="520" /><path class="p" d="M20 250 H300 M300 20 V400 M300 400 H480 M160 250 V540 M20 400 H160" />
      <path class="p" d="M240 250 a60 60 0 0 1 60 -60 M160 470 a50 50 0 0 0 50 50" /></svg><div class="tag" id="mg-hook-t1">Draft 1</div></div>
    <div class="sheet" id="mg-hook-s2"><svg viewBox="0 0 500 560">
      <rect class="p" x="20" y="20" width="460" height="520" /><path class="p" d="M20 220 H320 M320 20 V540 M20 380 H320 M180 380 V540 M320 300 H480" />
      <path class="p" d="M260 220 a60 60 0 0 1 60 -60" /><path class="pd" d="M30 90 H470" /></svg><div class="tag">Draft 4</div></div>
    <div class="sheet" id="mg-hook-s3"><svg viewBox="0 0 500 560">
      <rect class="p" x="20" y="20" width="460" height="520" /><path class="p" d="M20 240 H280 M280 20 V540 M20 400 H280 M280 330 H480 M140 400 V540" />
      <path class="p" d="M220 240 a60 60 0 0 1 60 -60" /><path class="pd" d="M30 90 H470" />
      <path class="redl" id="mg-hook-red1" pathLength="1" d="M20 70 H480" /><circle class="redc" id="mg-hook-red2" pathLength="1" cx="400" cy="70" r="46" /></svg>
      <div class="tag" id="mg-hook-t3">Draft 7</div></div>
    <div class="stamp" id="mg-hook-stamp">RETURNED</div>
    <div class="reason" id="mg-hook-reason"><div class="who">Development authority</div><div class="why">Front setback: 8 ft (needs 10 ft)</div></div>
  </div>
  <div class="weeks" id="mg-hook-weeks"><div class="l">Elapsed</div><div class="n">Week <span id="mg-hook-wk">1</span></div></div>

  <div class="room" id="mg-hook-room"><svg viewBox="0 0 1920 1080" id="mg-hook-rsvg">
    <path class="rl" pathLength="1" d="M0 0 L700 330 M1920 0 L1220 330 M0 1080 L700 750 M1920 1080 L1220 750" />
    <rect class="rl" pathLength="1" x="700" y="330" width="520" height="420" />
    <path class="rd" pathLength="1" d="M350 165 V915 M1570 165 V915 M350 165 H1570 M350 915 H1570" />
    <path class="door" d="M900 750 V470 H1020 V750 Z" />
  </svg></div>
  <div class="close" id="mg-hook-close">Until it’s built, nobody can <span>walk through the rooms.</span></div>

  <div class="redwash" id="mg-hook-redwash"></div>
  <div class="vign"></div>
  <div class="grain" id="mg-hook-grain"></div>
  <div class="black" id="mg-hook-black"></div>
</div>
<script>
(function(){
// Cue times (seconds, local) are written by scripts/build.py from the voice-over word timings.
const C = {"l1": 1.53, "once": 2.98, "l2": 4.07, "weeks": 5.78, "l4": 6.39, "stamp": 7.78, "room": 9.64};
const D = 12.836;
const tl = gsap.timeline({ paused: true });
const $ = (id) => document.getElementById("mg-hook-" + id);
const q = (s) => document.querySelectorAll("#mg-hook " + s);
tl.fromTo($("grid"), { x: 0, y: 0 }, { x: -96, y: -48, duration: D, ease: "none" }, 0);
tl.fromTo($("grain"), { x: 0, y: 0 }, { x: 256, y: 192, duration: D, ease: "steps(" + Math.round(D * 12) + ")" }, 0);
tl.fromTo($("kicker"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.1);
// beat 1: "Most families build a home only once."
q(".big .a .w").forEach((w, i) => tl.fromTo(w, { yPercent: 110 }, { yPercent: 0, duration: 0.5, ease: "expo.out" }, C.l1 + i * 0.09));
tl.fromTo($("once"), { yPercent: 110, scale: 1.0 }, { yPercent: 0, duration: 0.6, ease: "expo.out" }, C.once);
tl.fromTo($("big"), { scale: 1 }, { scale: 1.04, duration: C.l2 - C.l1, ease: "none" }, C.l1);
tl.to($("big"), { opacity: 0, y: -60, filter: "blur(8px)", duration: 0.35, ease: "power2.in" }, C.l2 - 0.4);
// beat 2: "The plan goes back and forth for weeks": drafts swap back and forth, the weeks run
tl.fromTo($("l2"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, C.l2);
tl.fromTo($("weeks"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, C.l2 + 0.15);
tl.fromTo($("s1"), { opacity: 0, x: 380, rotationY: -40, rotation: 6 }, { opacity: 1, x: 0, rotationY: -8, rotation: -3, duration: 0.55, ease: "expo.out" }, C.l2 + 0.05);
const swing = Math.max(0.5, (C.weeks - C.l2) / 2);
tl.to($("s1"), { x: -160, rotationY: 14, rotation: -7, opacity: 0.45, duration: 0.5, ease: "power3.inOut" }, C.l2 + swing);
tl.fromTo($("s2"), { opacity: 0, x: 420, rotationY: -40, rotation: 8 }, { opacity: 1, x: 40, rotationY: -6, rotation: 4, duration: 0.55, ease: "expo.out" }, C.l2 + swing);
tl.to($("s2"), { x: 180, rotationY: -16, rotation: 8, opacity: 0.45, duration: 0.5, ease: "power3.inOut" }, C.weeks - 0.1);
tl.fromTo($("s3"), { opacity: 0, x: -420, rotationY: 40, rotation: -8 }, { opacity: 1, x: 0, rotationY: 0, rotation: -2, duration: 0.55, ease: "expo.out" }, C.weeks - 0.1);
const wk = $("wk"), t3 = $("t3");
const st = { w: 1 };
tl.fromTo(st, { w: 1 }, { w: 7, duration: Math.max(0.8, C.stamp - C.l2 - 0.4), ease: "power1.in",
  onUpdate: () => { const w = Math.round(st.w); wk.textContent = String(w); t3.textContent = "Draft " + w; } }, C.l2 + 0.2);
// beat 3: "one setback mistake gets it returned by the authority"
tl.fromTo($("l4"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, C.l4);
tl.fromTo($("red1"), { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, C.l4 + 0.15);
tl.fromTo($("red2"), { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, C.l4 + 0.45);
tl.fromTo($("stamp"), { opacity: 0, scale: 2.8, rotation: -24 }, { opacity: 1, scale: 1, rotation: -10, duration: 0.24, ease: "power4.in" }, C.stamp);
tl.fromTo($("redwash"), { opacity: 0 }, { keyframes: [{ opacity: 1, duration: 0.06 }, { opacity: 0, duration: 0.7 }], ease: "power2.out" }, C.stamp + 0.24);
tl.fromTo("#mg-hook", { x: 0, y: 0 }, { keyframes: [{ x: -22, y: 12, duration: 0.04 }, { x: 16, y: -10, duration: 0.04 }, { x: -8, y: 5, duration: 0.05 }, { x: 0, y: 0, duration: 0.08 }], ease: "none" }, C.stamp + 0.24);
tl.fromTo($("reason"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, C.stamp + 0.5);
// beat 4: "and until it's built, nobody can walk through the rooms"
tl.to([$("stage"), $("lines"), $("weeks"), $("kicker")], { opacity: 0, x: -50, filter: "blur(6px)", duration: 0.35, ease: "power2.in" }, C.room - 0.35);
tl.to($("glow"), { opacity: 0.35, duration: 0.5 }, C.room - 0.3);
tl.fromTo($("room"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, C.room);
q(".room [pathLength]").forEach((p, i) => tl.fromTo(p, { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, C.room + i * 0.1));
tl.fromTo("#mg-hook-room .door", { opacity: 0 }, { opacity: 1, duration: 0.5 }, C.room + 0.5);
tl.fromTo($("rsvg"), { scale: 1 }, { scale: 1.45, duration: D - C.room, ease: "power1.in" }, C.room);
tl.fromTo($("close"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, C.room + 0.15);
tl.fromTo($("black"), { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.in" }, D - 0.38);
window.__timelines["mg-hook"] = tl;
})();
</script>
</template>
