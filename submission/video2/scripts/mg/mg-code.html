<script>
(function(){
const C = __CUES__;
const D = __DUR__;
const tl = gsap.timeline({ paused: true });
tl.fromTo("#mg-code-wrap", { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.4, ease: "power3.inOut" }, 0);
tl.fromTo("#mg-code-bg", { x: 0 }, { x: -50, duration: D, ease: "none" }, 0);

const lines = document.querySelectorAll("#mg-code .cl");
const span = Math.max(1.2, D - 1.1);
tl.fromTo(lines, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.2, stagger: span / lines.length, ease: "power2.out" }, 0.45);

tl.fromTo("#mg-code-list", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, Math.min(C.list - 0.4, 0.5));
const items = document.querySelectorAll("#mg-code .it");
tl.fromTo(items, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.25, stagger: 0.09, ease: "power2.out" }, Math.min(C.list - 0.2, 0.7));
tl.fromTo("#mg-code .it .bx i", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.22, stagger: 0.14, ease: "back.out(2.4)" }, C.list + 0.1);
tl.to("#mg-code-wrap", { clipPath: "inset(0% 0% 100% 0%)", duration: 0.4, ease: "power3.in" }, D - 0.42);
window.__timelines["mg-code"] = tl;
})();
