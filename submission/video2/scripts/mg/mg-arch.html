<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /></head>
<body>
<template id="mg-arch-template">
<style>
@font-face { font-family: "Geist"; src: url("assets/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Geist Mono"; src: url("assets/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; }
#mg-arch { position:absolute; inset:0; width:100%; height:100%; overflow:hidden; font-family:"Geist", sans-serif; color:#111113; }
#mg-arch .wrap { position:absolute; inset:0; }
#mg-arch .bg { position:absolute; inset:-60px; background-color:#F6F6F3;
  background-image: radial-gradient(1200px 800px at 40% 50%, rgba(39,71,245,.09), rgba(39,71,245,0) 70%),
    linear-gradient(rgba(17,17,19,.055) 2px, transparent 2px), linear-gradient(90deg, rgba(17,17,19,.055) 2px, transparent 2px),
    linear-gradient(rgba(17,17,19,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(17,17,19,.03) 1px, transparent 1px);
  background-size:100% 100%, 240px 240px, 240px 240px, 48px 48px, 48px 48px; }
#mg-arch .head { position:absolute; left:120px; top:56px; }
#mg-arch .head .k { font-family:"Geist Mono", monospace; font-size:34px; color:#2747F5; }
#mg-arch .head .t { font-size:66px; font-weight:670; letter-spacing:-0.04em; line-height:1.05; margin-top:4px; }
#mg-arch .tf { position:absolute; left:120px; top:240px; width:1100px; height:780px; border-radius:28px; background:#111113; color:#F5F5F7; padding:30px 36px; box-shadow:0 36px 80px -30px rgba(17,17,19,.7); opacity:0; }
#mg-arch .tf .th { display:flex; align-items:center; justify-content:space-between; }
#mg-arch .tf .tn { font-size:44px; font-weight:670; letter-spacing:-0.02em; }
#mg-arch .tf .ts { font-family:"Geist Mono", monospace; font-size:30px; color:#A1A1A6; }
#mg-arch .m { position:relative; margin-top:22px; padding:20px 26px; border-radius:20px; background:rgba(255,255,255,.06); box-shadow:inset 0 0 0 2px rgba(255,255,255,.08); opacity:0; }
#mg-arch .m .glow { position:absolute; inset:0; border-radius:20px; box-shadow:inset 0 0 0 4px #7D93FF; opacity:0; }
#mg-arch .m .mn { font-size:42px; font-weight:660; letter-spacing:-0.02em; white-space:nowrap; }
#mg-arch .m .mn span { font-family:"Geist Mono", monospace; font-size:28px; font-weight:500; color:#9DB0FF; margin-left:14px; }
#mg-arch .m .jobs { display:flex; flex-wrap:wrap; gap:10px 12px; margin-top:12px; }
#mg-arch .m .jobs i { font-style:normal; font-size:31px; padding:5px 16px; border-radius:999px; background:rgba(255,255,255,.1); color:#E6E6EA; white-space:nowrap; }
#mg-arch .fb { margin-top:20px; font-family:"Geist Mono", monospace; font-size:28px; color:#A1A1A6; opacity:0; white-space:nowrap; }
#mg-arch .card { position:absolute; left:1300px; width:520px; border-radius:24px; background:#FFFFFF; padding:20px 26px; box-shadow:0 0 0 2px rgba(17,17,19,.08), 0 26px 60px -28px rgba(17,17,19,.4); opacity:0; }
#mg-arch .card .ct { font-size:38px; font-weight:660; letter-spacing:-0.02em; white-space:nowrap; }
#mg-arch .card .cs { font-size:31px; color:#46464B; margin-top:4px; line-height:1.22; }
#mg-arch .card.img { box-shadow:0 0 0 2px rgba(17,17,19,.08), 0 26px 60px -28px rgba(17,17,19,.4); background:#FBFBF9; }
#mg-arch svg.wires { position:absolute; left:0; top:0; width:1920px; height:1080px; overflow:visible; }
#mg-arch .wires path { fill:none; stroke:#2747F5; stroke-width:5; stroke-linecap:round; }
</style>
<div id="mg-arch" data-composition-id="mg-arch" data-width="1920" data-height="1080" data-duration="__DUR__">
  <div class="wrap" id="mg-arch-wrap">
    <div class="bg" id="mg-arch-bg" data-layout-allow-overflow></div>
    <div class="head" id="mg-arch-head"><div class="k">Architecture</div><div class="t">Every agent runs on Nebius Token Factory</div></div>
    <svg class="wires" viewBox="0 0 1920 1080">
      <path id="mg-arch-w1" pathLength="1" d="M1220 380 H1300" />
      <path id="mg-arch-w2" pathLength="1" d="M1220 560 H1300" />
      <path id="mg-arch-w3" pathLength="1" d="M1220 740 H1300" />
    </svg>
    <div class="tf" id="mg-arch-tf">
      <div class="th"><div class="tn">Nebius Token Factory</div><div class="ts">NVIDIA Nemotron</div></div>
      <div class="m" id="mg-arch-m1"><div class="glow"></div><div class="mn">Nemotron 3 Ultra</div>
        <div class="jobs"><i>3 plan drafts</i><i>fixer agent · tool calls</i><i>rule pack</i><i>3D model as code</i></div></div>
      <div class="m" id="mg-arch-m2"><div class="glow"></div><div class="mn">Nemotron 3 Super</div>
        <div class="jobs"><i>setup agent · Google ADK</i><i>the conversation</i></div></div>
      <div class="m" id="mg-arch-m3"><div class="glow"></div><div class="mn">Nemotron 3.5 Super VL</div>
        <div class="jobs"><i>reads drawings</i><i>concept checklist</i><i>3D vs concept match</i></div></div>
      <div class="fb" id="mg-arch-fb">fallback on 429 / 5xx: Ultra → Super → Nemotron 3.5 Lightning</div>
    </div>
    <div class="card" id="mg-arch-c1" style="top:300px;"><div class="ct">Rules engine</div><div class="cs">checks every plan against the bylaws</div></div>
    <div class="card" id="mg-arch-c2" style="top:480px;"><div class="ct">Tavily</div><div class="cs">searches and extracts a city’s building rules</div></div>
    <div class="card" id="mg-arch-c3" style="top:660px;"><div class="ct">Your browser</div><div class="cs">runs the 3D code with three.js, room by room</div></div>
    <div class="card img" id="mg-arch-c4" style="top:860px;"><div class="ct">Gemini image model</div><div class="cs">concepts and photos only</div></div>
  </div>
</div>
<script>
(function(){
const C = __CUES__;
const D = __DUR__;
const tl = gsap.timeline({ paused: true });
const wire = (id, at) => tl.fromTo(id, { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.inOut" }, at);
const glow = (id, at) => {
  tl.fromTo(id, { scale: 1 }, { scale: 1.025, duration: 0.25, ease: "power2.out" }, at);
  tl.to(id, { scale: 1, duration: 0.3, ease: "power2.inOut" }, at + 0.25);
  tl.fromTo(id + " .glow", { opacity: 0 }, { opacity: 1, duration: 0.25 }, at);
};
tl.fromTo("#mg-arch-wrap", { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.42, ease: "power3.inOut" }, 0);
tl.fromTo("#mg-arch-bg", { x: 0 }, { x: -60, duration: D, ease: "none" }, 0);
tl.fromTo("#mg-arch-head", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.3);
tl.fromTo("#mg-arch-tf", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.45);
tl.fromTo("#mg-arch .m", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.35, stagger: 0.12, ease: "power2.out" }, 0.7);
tl.fromTo("#mg-arch-fb", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.2);
tl.fromTo("#mg-arch .card", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.4, stagger: 0.12, ease: "power3.out" }, 0.9);
wire("#mg-arch-w1", 1.2); wire("#mg-arch-w2", 1.3); wire("#mg-arch-w3", 1.4);
// "Ultra plans, fixes and writes the code." / "Super runs the conversation." / "The vision model reads drawings and checks the build."
glow("#mg-arch-m1", C.ultra);
tl.to("#mg-arch-m1 .glow", { opacity: 0, duration: 0.3 }, C.super - 0.05);
glow("#mg-arch-m2", C.super);
tl.to("#mg-arch-m2 .glow", { opacity: 0, duration: 0.3 }, C.vl - 0.05);
glow("#mg-arch-m3", C.vl);
tl.to("#mg-arch-m3 .glow", { opacity: 0, duration: 0.3 }, C.nebius - 0.05);
// "All of it on Nebius Token Factory."
tl.fromTo("#mg-arch-tf", { boxShadow: "0 0 0 0px #2747F5, 0 36px 80px -30px rgba(17,17,19,.7)" }, { boxShadow: "0 0 0 8px #2747F5, 0 36px 80px -30px rgba(39,71,245,.7)", duration: 0.4, ease: "power2.out", immediateRender: false }, C.nebius);
tl.to("#mg-arch .m .glow", { opacity: 1, duration: 0.3 }, C.nebius + 0.1);
tl.to("#mg-arch-wrap", { clipPath: "inset(0% 0% 100% 0%)", duration: 0.42, ease: "power3.in" }, D - 0.45);
window.__timelines["mg-arch"] = tl;
})();
</script>
</template>
</body></html>
