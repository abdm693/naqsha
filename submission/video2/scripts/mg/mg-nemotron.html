<script>
(function(){
const C = __CUES__;
const D = __DUR__;
const tl = gsap.timeline({ paused: true });
const on = (n, at) => {
  tl.fromTo(`#mg-nemotron-n${n} .fill`, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, at);
  tl.fromTo(`#mg-nemotron-n${n} .lab`, { color: "#111113" }, { color: "#FFFFFF", duration: 0.25 }, at);
};
const off = (n, at) => {
  tl.to(`#mg-nemotron-n${n} .fill`, { opacity: 0.16, duration: 0.25 }, at);
  tl.to(`#mg-nemotron-n${n} .lab`, { color: "#111113", duration: 0.25 }, at);
};
tl.fromTo("#mg-nemotron-wrap", { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.42, ease: "power3.inOut" }, 0);
tl.fromTo("#mg-nemotron-bg", { x: 0 }, { x: -50, duration: D, ease: "none" }, 0);
tl.fromTo("#mg-nemotron-head", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.2);
tl.fromTo("#mg-nemotron .node", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.07, ease: "power3.out" }, 0.3);
tl.fromTo("#mg-nemotron .arrow", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, stagger: 0.07, ease: "power2.out" }, 0.42);
// "It drafts three floor plans at once"
on(1, C.draft);
tl.fromTo("#mg-nemotron-drafts", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, C.draft - 0.1);
tl.fromTo("#mg-nemotron .dk", { opacity: 0, y: 30, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, stagger: 0.09, ease: "back.out(1.6)" }, C.draft + 0.1);
tl.fromTo("#mg-nemotron .dk svg path", { strokeDasharray: 600, strokeDashoffset: 600 }, { strokeDashoffset: 0, duration: 0.9, ease: "power1.inOut" }, C.draft + 0.2);
// "A rules engine checks each one against the bylaws"
off(1, C.check); on(2, C.check);
tl.fromTo("#mg-nemotron .dk .ck", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, stagger: 0.12, ease: "back.out(2.5)" }, C.check + 0.15);
tl.fromTo("#mg-nemotron-best", { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, C.check + 0.7);
tl.to(["#mg-nemotron-d1", "#mg-nemotron-d3"], { opacity: 0.4, duration: 0.3 }, C.check + 0.7);
tl.fromTo("#mg-nemotron-dfoot", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, C.check + 0.8);
// "and a fixer agent repairs the best plan with tool calls"
off(2, C.fix); on(3, C.fix);
tl.fromTo("#mg-nemotron-fixer", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, C.fix - 0.15);
const step = 0.32;
["#mg-nemotron-t1", "#mg-nemotron-t2", "#mg-nemotron-t3", "#mg-nemotron-t4"].forEach((id, i) => {
  tl.fromTo(id, { opacity: 0, x: 18 }, { opacity: 1, x: 0, duration: 0.28, ease: "power2.out" }, C.fix + 0.3 + i * step);
});
tl.fromTo("#mg-nemotron-loop", { opacity: 0, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power2.inOut" }, C.fix + 0.2);
tl.fromTo("#mg-nemotron-loopp", { strokeDashoffset: 0 }, { strokeDashoffset: -80, duration: 1.0, ease: "none" }, C.fix + 0.6);
tl.fromTo("#mg-nemotron-loopl", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, C.fix + 0.4);
tl.fromTo("#mg-nemotron-wrap", { clipPath: "inset(0% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 100% 0%)", duration: 0.4, ease: "power3.in", immediateRender: false }, D - 0.42);
window.__timelines["mg-nemotron"] = tl;
})();
</script>
