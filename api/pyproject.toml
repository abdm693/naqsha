[project]
name = "naqsha-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "google-adk==2.12.0",
  "google-genai==2.31.0",
  "google-cloud-firestore==2.34.1",
  "google-cloud-storage==3.17.1",
  "uvicorn[standard]",
  "pydantic>=2",
  "pillow>=11",
  "openai>=2.54.0",
  "litellm>=1.106.5",
  "mcp>=2.3.0",
